name: gl_volition
description: A Unity-style game engine (GameObjects, components, fixed-step loop, triggers, 2D/3D, audio, live inspector) built on the pixeldart renderer.
version: 0.1.0
repository: https://github.com/soulwax/glVolition
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  pixeldart:
    path: vendor/pixeldart
  voxlog:
    path: vendor/voxlog
  voxui:
    path: vendor/voxui
  voxecs:
    path: vendor/voxecs
  voxai:
    path: vendor/voxai
  voxsynth:
    path: vendor/voxsynth
  voxtween:
    path: vendor/voxtween
  voxgeom:
    path: vendor/voxgeom
  voxpath:
    path: vendor/voxpath
  voxproc:
    path: vendor/voxproc
  voxphys:
    path: vendor/voxphys
  voxnet:
    path: vendor/voxnet
  voxanim:
    path: vendor/voxanim
  voxlight:
    path: vendor/voxlight
  voxdsp:
    path: vendor/voxdsp
  web: ^0.5.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0

executables:
  volition: volition
  rocket: volition
